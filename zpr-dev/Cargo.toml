[package]
name = "zpr-dev"
version = "0.1.0"
edition = "2024"

# Dependencies are deliberately minimal (spec §6.1): no async runtime, no HTTP
# client, no regex, no terminal-color or progress-bar crates, no libgit2.
[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
