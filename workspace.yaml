# The ZPR development workspace: the repository set that `zpr-dev setup` clones
# side by side, and the shared context it renders into each one. See
# zpr-dev/docs/specs/spec-001-zpr-dev.md §3.
#
# Every optional field has a default, so the common repository entry is three
# lines. Unknown keys are ignored, so this file may grow ahead of the tool.

version: 1

workspace:
  name: zpr

repositories:
  # Core ZPR components
  - name: zpr-core
    url: git@github.com:org-zpr/zpr-core.git

  # Shared zpr crate
  - name: zpr-common
    url: git@github.com:org-zpr/zpr-common.git

  # ZPR Visa Service component
  - name: zpr-visaservice
    url: git@github.com:org-zpr/zpr-visaservice.git

  # Visa Service API
  - name: zpr-vsapi
    url: git@github.com:org-zpr/zpr-vsapi.git

  # The ZPL Compiler
  - name: zpr-compiler
    url: git@github.com:org-zpr/zpr-compiler.git

  # ZPR Policy descriptor source
  - name: zpr-policy
    url: git@github.com:org-zpr/zpr-policy.git

  # Zero-Trust Packet Routing RFCs
  - name: zpr-rfcs
    url: git@github.com:org-zpr/zpr-rfcs.git

  # Resources to run ZPRnet demos
  - name: zpr-demo
    url: git@github.com:org-zpr/zpr-demo.git

  # Non-ZPR-specific utilities used by ZPR
  - name: zpr-utils
    url: git@github.com:org-zpr/zpr-utils.git

  # Development tools for the ZPR project
  - name: zpr-dev-tools
    url: git@github.com:org-zpr/zpr-dev-tools.git

documentation:
  root: docs

agent:
  hermes:
    shared_skills: skills
